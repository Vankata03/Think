name: CI

on:
  pull_request:
    branches:
      - develop
      - prod
      - "release/**"
  push:
    branches:
      - develop
      - prod
      - "release/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build-test
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun simctl list devices available

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Think.xcodeproj \
            -scheme Think \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Think.xcodeproj \
            -scheme Think \
            -testPlan Think \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults/Think.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Think.xcresult
          path: TestResults/Think.xcresult
          if-no-files-found: ignore
          retention-days: 14
