<!doctype html>
<!-- PROTOTYPE, throwaway. Focus canvas round 6 for "Focus: timer screen and session close flow" (#76).
     The Reflect sheet: one screen, outcome and energy as chips, a note, Save in the toolbar. Interactive. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · Focus Reflect sheet</title>
<style>
  :root {
    --bg:#000; --surface:#1C1C1E; --raised:#2C2C2E; --label:#fff; --sheet:#1C1C1E;
    --sec:rgba(235,235,245,.6); --ter:rgba(235,235,245,.3); --sep:rgba(84,84,88,.65);
    --accent:#FFD433; --accentInk:#FFD433; --onFill:#000; --green:#30D158; --orange:#FF9F0A;
    --glass:rgba(40,40,44,.72); --glassEdge:rgba(255,255,255,.14); --page:#111;
  }
  body.light {
    --bg:#F2F2F7; --surface:#fff; --raised:#E5E5EA; --label:#000; --sheet:#F2F2F7;
    --sec:rgba(60,60,67,.6); --ter:rgba(60,60,67,.3); --sep:rgba(60,60,67,.29);
    --accent:#F2C41C; --accentInk:#6E5C05; --green:#34C759; --orange:#C93400;
    --glass:rgba(250,250,252,.78); --glassEdge:rgba(0,0,0,.1); --page:#d9d9de;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif; color:var(--label); padding:24px 24px 110px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .intro { color:var(--sec); font-size:13px; max-width:1150px; margin-bottom:18px; line-height:1.45; }
  .intro b { color:var(--label); }
  .row { display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start; }
  .col { display:flex; flex-direction:column; gap:8px; }
  .cap { font-size:12px; color:var(--sec); width:360px; line-height:1.4; min-height:34px; }
  .cap b { color:var(--label); }

  .phone { width:360px; height:760px; border-radius:48px; background:var(--bg); position:relative; overflow:hidden; flex:none; box-shadow:0 0 0 10px #2a2a2c, 0 20px 50px rgba(0,0,0,.4); }
  .status { height:50px; display:flex; justify-content:space-between; align-items:flex-end; padding:0 34px 6px; font-size:15px; font-weight:600; }
  .under { position:absolute; inset:0; opacity:.9; }
  .under .t { font-family:"New York",ui-serif,Georgia,serif; font-size:22px; text-align:center; margin-top:40px; color:var(--sec); }
  .dim { position:absolute; inset:0; background:rgba(0,0,0,.45); }
  .sheet { position:absolute; left:0; right:0; bottom:0; top:var(--top,150px); background:var(--sheet); border-radius:34px 34px 0 0; padding:8px 18px 20px; overflow-y:auto; scrollbar-width:none; }
  .sheet::-webkit-scrollbar { display:none; }
  .grab { width:36px; height:5px; border-radius:3px; background:var(--ter); margin:0 auto 8px; }
  .bar { display:flex; justify-content:space-between; align-items:center; height:40px; margin-bottom:6px; }
  .circ { width:36px; height:36px; border-radius:50%; background:var(--glass); border:1px solid var(--glassEdge); display:grid; place-items:center; font-size:15px; cursor:pointer; }
  .save { border-radius:999px; padding:8px 16px; font-weight:600; font-size:15px; cursor:pointer; }
  .save.on { background:var(--accent); color:var(--onFill); }
  .save.off { background:var(--glass); color:var(--ter); border:1px solid var(--glassEdge); }
  .bar .ttl { font-weight:600; font-size:17px; }

  .serif { font-family:"New York",ui-serif,Georgia,serif; font-size:24px; text-align:center; line-height:1.2; outline:none; padding:2px 6px; border-radius:8px; }
  .serif:empty::before { content:attr(data-ph); color:var(--ter); }
  .meta { text-align:center; color:var(--sec); font-size:14px; margin-top:6px; }
  .meta .p { color:var(--orange); font-weight:600; }
  .sect { margin-top:22px; }
  .sh { font-size:13px; color:var(--sec); font-weight:600; margin:0 4px 8px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { flex:1 1 auto; text-align:center; padding:11px 10px; border-radius:14px; border:1px solid var(--glassEdge); background:var(--surface); font-size:15px; cursor:pointer; white-space:nowrap; transition:all .12s; }
  .chip .s { display:block; font-size:18px; margin-bottom:3px; color:var(--sec); }
  .chip.on { background:var(--accent); color:var(--onFill); border-color:transparent; font-weight:600; }
  .chip.on .s { color:var(--onFill); }
  .seg { display:flex; background:var(--raised); border-radius:10px; padding:2px; }
  .seg div { flex:1; text-align:center; padding:7px 4px; font-size:13.5px; border-radius:8px; cursor:pointer; }
  .seg div.on { background:var(--surface); box-shadow:0 1px 4px rgba(0,0,0,.3); font-weight:600; }
  .note { min-height:110px; background:var(--surface); border-radius:16px; padding:12px 14px; font-size:16px; outline:none; line-height:1.35; }
  .note:empty::before { content:attr(data-ph); color:var(--ter); }
  .foot { font-size:12.5px; color:var(--sec); margin:8px 4px 0; line-height:1.35; }
  .lock { display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:40px; text-align:center; color:var(--sec); font-size:15px; }
  .lock .big { font-size:40px; }
  .lock .btn { background:var(--glass); border:1px solid var(--glassEdge); border-radius:999px; padding:11px 20px; color:var(--label); font-weight:600; }
  .stats { display:flex; justify-content:center; gap:22px; margin-top:12px; }
  .stats div { text-align:center; } .stats b { display:block; font-family:ui-rounded,-apple-system; font-size:22px; font-variant-numeric:tabular-nums; }
  .stats span { font-size:12px; color:var(--sec); }
  .toast { position:absolute; left:50%; transform:translateX(-50%); bottom:40px; background:var(--glass); border:1px solid var(--glassEdge); border-radius:14px; padding:8px 14px; font-size:13px; white-space:nowrap; }

  .switch { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:rgba(20,20,22,.92); color:#fff; border-radius:18px; padding:10px 14px;
            display:flex; gap:6px; align-items:center; font-size:13px; z-index:9; box-shadow:0 10px 30px rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.12); }
  .switch button { background:#2c2c2e; color:#fff; border:0; border-radius:9px; padding:6px 10px; font-size:13px; cursor:pointer; }
  .switch button.on { background:#FFD433; color:#000; font-weight:600; }
  .switch .lab { color:#aaa; margin:0 4px; }
</style>
</head>
<body>
<h1>PROTOTYPE · Focus: the Reflect sheet</h1>
<div class="intro" id="intro"></div>
<div class="row" id="stage"></div>
<div class="switch"><span class="lab">Controls</span><button data-k="ctl" data-v="chips">Chips</button><button data-k="ctl" data-v="seg">Segmented</button>
  <span class="lab">Detent</span><button data-k="det" data-v="medium">Medium</button><button data-k="det" data-v="large">Large</button>
  <span class="lab">·</span><button id="scheme">Light</button><button id="reset">Reset</button></div>

<script>
const q = new URLSearchParams(location.search);
const S = { ctl:q.get('ctl')||'chips', det:q.get('det')||'large', scheme:q.get('scheme')||'dark' };
const OUT = [['checkmark','✓','Done'],['arrow.forward','→','Moved forward'],['arrow.triangle.turn','↱','Changed direction']];
const EN = [['battery.25','▁','Low'],['battery.50','▃','Steady'],['battery.100','▆','High']];
// per-phone state
const P = { a:{o:null,e:null,saved:false}, b:{o:'Moved forward',e:'Steady',saved:false}, c:{o:null,e:null,saved:false}, d:{o:null,e:null,saved:false} };

function group(id, key, opts, cur) {
  if (S.ctl==='seg') return `<div class="seg">${opts.map(([,,n])=>`<div class="${cur===n?'on':''}" data-p="${id}" data-k="${key}" data-n="${n}">${n}</div>`).join('')}</div>`;
  return `<div class="chips">${opts.map(([,s,n])=>`<div class="chip ${cur===n?'on':''}" data-p="${id}" data-k="${key}" data-n="${n}"><span class="s">${s}</span>${n}</div>`).join('')}</div>`;
}
function sheet(id, o) {
  const st = P[id]; const dirty = st.o || st.e || o.noteText;
  const top = S.det==='medium' ? 330 : 64;
  let body;
  if (o.locked) body = `<div class="serif" style="color:var(--sec)">Session · 25 min</div><div class="meta">14:05 – 14:30 · Completed</div>
      <div class="lock"><div class="big">🔒</div>Your intention and reflection are private.<div class="btn">Unlock with Face ID</div></div>`;
  else body = `
    <div class="serif" contenteditable="true" data-ph="What were you working on?">${o.intention||''}</div>
    <div class="meta">${o.partial ? `14:05 – 14:17 · <span class="p">12 of 25 min</span>` : '14:05 – 14:30 · 25 min'}</div>
    <div class="sect"><div class="sh">How did it go?</div>${group(id,'o',OUT,st.o)}</div>
    <div class="sect"><div class="sh">Energy</div>${group(id,'e',EN,st.e)}</div>
    <div class="sect"><div class="note" contenteditable="true" data-ph="A note for your journal (optional)">${o.noteText||''}</div>
      <div class="foot">Saved to your Journal as a focus note. Tap a chosen chip again to clear it.</div></div>`;
  return `<div class="sheet" style="--top:${top}px"><div class="grab"></div>
    <div class="bar"><div class="circ">✕</div><div class="ttl">Reflect</div>${o.locked ? '<div style="width:36px"></div>' : `<div class="save ${dirty?'on':'off'}" data-save="${id}">Save</div>`}</div>
    ${body}</div>${st.saved ? '<div class="toast">✓ Saved to Journal</div>' : ''}`;
}
function phone(id, o) {
  return `<div class="phone"><div class="status"><span>14:31</span><span>●●● ▮</span></div>
    <div class="under"><div class="t">${o.intention||'Deep work'}</div></div><div class="dim"></div>${sheet(id,o)}</div>`;
}
function render() {
  document.body.classList.toggle('light', S.scheme==='light');
  document.querySelectorAll('.switch button[data-k]').forEach(b=>b.classList.toggle('on', S[b.dataset.k]===b.dataset.v));
  document.getElementById('scheme').classList.toggle('on', S.scheme==='light');
  document.getElementById('intro').innerHTML = `The Reflect button in the break state (and the Last session line) opens this sheet. It's one screen, no pushes. The intention is the serif headline, editable in place. Under it: the session's clock span and length. <b>Outcome</b> and <b>energy</b> are three choices each: tap to choose, tap again to clear, and nothing chosen means "not recorded". The note is optional and saves as a focus note in the Journal. <b>Save</b> sits in the toolbar and is only prominent once something changed. The close button (✕) discards, but drafts stay recoverable as today. Symbols in the chips stand in for SF Symbols: ${OUT.map(x=>x[0]).join(', ')}; ${EN.map(x=>x[0]).join(', ')}.`;
  const cols = [
    ['<b>Just finished.</b> Nothing chosen yet, so Save is quiet.', phone('a',{intention:'Write chapter 3'})],
    ['<b>Filled in.</b> Two choices and a note, so Save becomes the accent.', phone('b',{intention:'Write chapter 3', noteText:'Got the opening scene down; the middle still drags.'})],
    ['<b>Partial effort.</b> The session ended at 12 of 25 minutes, and the meta line says so in orange. No intention was set, so the headline is an empty field.', phone('c',{partial:true})],
    ['<b>Journal locked.</b> Timing stays visible because it\'s public progress. Everything private waits behind Face ID.', phone('d',{locked:true})],
  ];
  document.getElementById('stage').innerHTML = cols.map(([c,h])=>`<div class="col"><div class="cap">${c}</div>${h}</div>`).join('');
  document.querySelectorAll('[data-p]').forEach(el => el.onclick = () => { const st = P[el.dataset.p]; const k = el.dataset.k; st[k] = st[k]===el.dataset.n ? null : el.dataset.n; st.saved=false; render(); });
  document.querySelectorAll('[data-save]').forEach(el => el.onclick = () => { if (!el.classList.contains('on')) return; P[el.dataset.save].saved = true; render(); });
  history.replaceState(null,'','?'+new URLSearchParams(S).toString());
}
document.querySelectorAll('.switch button[data-k]').forEach(b => b.onclick = () => { S[b.dataset.k]=b.dataset.v; render(); });
document.getElementById('scheme').onclick = () => { S.scheme = S.scheme==='light'?'dark':'light'; render(); };
document.getElementById('reset').onclick = () => { P.a={o:null,e:null,saved:false}; P.b={o:'Moved forward',e:'Steady',saved:false}; P.c={o:null,e:null,saved:false}; render(); };
render();
</script>
</body>
</html>
